<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCMB Shortener — Link Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --success: #22c55e;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }

    input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 0.85rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: var(--accent);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    @media (max-width: 500px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .status {
      font-size: 0.88rem;
      padding: 0.75rem;
      border-radius: 8px;
      display: none;
      word-break: break-all;
    }

    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .status.success {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.35);
      color: #86efac;
    }

    .status a {
      color: var(--accent);
      text-decoration: underline;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-top: 0.25rem;
    }

    .stat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .stat-value {
      font-size: 1.05rem;
      font-weight: 600;
      margin-top: 0.2rem;
      word-break: break-word;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .history-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .history-links {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-links a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .history-target {
      color: var(--muted);
      font-size: 0.78rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>api.pcmb.qzz.io</h1>
      <span id="apiStatus" class="badge">Checking API...</span>
    </header>

    <!-- Create Short Link Card -->
    <form id="shortenForm" class="card">
      <h2>Create Short Link</h2>

      <div class="field">
        <label for="targetUrl">Destination URL *</label>
        <input type="url" id="targetUrl" placeholder="https://sjvbarauni.com/..." required />
      </div>

      <div class="row">
        <div class="field">
          <label for="customSlug">Custom Slug (optional)</label>
          <input type="text" id="customSlug" placeholder="e.g. notes-12" pattern="[a-zA-Z0-9_-]{3,24}" />
        </div>
        <div class="field">
          <label for="apiKey">API Key *</label>
          <input type="password" id="apiKey" placeholder="Your API_KEY" required />
        </div>
      </div>

      <button type="submit" id="submitBtn">Shorten URL</button>
      <div id="createResult" class="status"></div>
    </form>

    <!-- Check Link Stats Card -->
    <form id="statsForm" class="card">
      <h2>Check Link Stats</h2>
      <div class="row">
        <input type="text" id="statsSlug" placeholder="Enter slug (e.g. sjv)" required />
        <button type="submit" class="secondary">Get Stats</button>
      </div>
      <div id="statsError" class="status"></div>
      <div id="statsOutput" class="stats-grid" style="display: none;">
        <div class="stat-box">
          <div class="stat-label">Total Clicks</div>
          <div class="stat-value" id="statClicks">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Last Clicked</div>
          <div class="stat-value" id="statLastClick">Never</div>
        </div>
        <div class="stat-box" style="grid-column: span 2;">
          <div class="stat-label">Target URL</div>
          <div class="stat-value" id="statTarget" style="font-size: 0.85rem;">—</div>
        </div>
      </div>
    </form>

    <!-- Local Recent Links -->
    <div class="card" id="historyCard" style="display: none;">
      <h2>Recent Links (This Browser)</h2>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://api.pcmb.qzz.io';

    const apiKeyInput = document.getElementById('apiKey');
    const savedKey = sessionStorage.getItem('shortener_api_key');
    if (savedKey) apiKeyInput.value = savedKey;

    // Health ping
    fetch(`${API_BASE}/api/health`)
      .then((res) => res.ok ? res.json() : Promise.reject())
      .then((data) => {
        const badge = document.getElementById('apiStatus');
        badge.textContent = `Online · ${data.rssMB} MB RAM`;
      })
      .catch(() => {
        const badge = document.getElementById('apiStatus');
        badge.textContent = 'API Offline';
        badge.style.color = '#fca5a5';
        badge.style.background = 'rgba(239, 68, 68, 0.15)';
        badge.style.borderColor = 'rgba(239, 68, 68, 0.35)';
      });

    // Create short link
    document.getElementById('shortenForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('createResult');
      const url = document.getElementById('targetUrl').value.trim();
      const slug = document.getElementById('customSlug').value.trim();
      const apiKey = apiKeyInput.value.trim();

      sessionStorage.setItem('shortener_api_key', apiKey);
      btn.disabled = true;
      btn.textContent = 'Creating...';
      resultBox.className = 'status';
      resultBox.innerHTML = '';

      try {
        const payload = slug ? { url, slug } : { url };
        const res = await fetch(`${API_BASE}/api/shorten`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || `Request failed (${res.status})`);
        }

        resultBox.className = 'status success';
        resultBox.innerHTML = `
          <span>Created: <a href="${data.shortUrl}" target="_blank" rel="noopener">${data.shortUrl}</a></span>
          <button type="button" class="secondary" style="padding: 0.35rem 0.65rem; font-size: 0.8rem;" onclick="copyText('${data.shortUrl}', this)">Copy</button>
        `;

        saveHistory(data);
        document.getElementById('targetUrl').value = '';
        document.getElementById('customSlug').value = '';
      } catch (err) {
        resultBox.className = 'status error';
        resultBox.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Shorten URL';
      }
    });

    // Check stats
    document.getElementById('statsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const slug = document.getElementById('statsSlug').value.trim();
      const errBox = document.getElementById('statsError');
      const outBox = document.getElementById('statsOutput');

      errBox.className = 'status';
      outBox.style.display = 'none';

      try {
        const res = await fetch(`${API_BASE}/api/stats/${encodeURIComponent(slug)}`);
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || `Failed (${res.status})`);
        }

        document.getElementById('statClicks').textContent = data.clicks ?? 0;
        document.getElementById('statLastClick').textContent = data.lastClickedAt
          ? new Date(data.lastClickedAt).toLocaleString()
          : 'Never';
        document.getElementById('statTarget').textContent = data.targetUrl;
        outBox.style.display = 'grid';
      } catch (err) {
        errBox.className = 'status error';
        errBox.textContent = err.message;
      }
    });

    function copyText(text, btn) {
      navigator.clipboard.writeText(text);
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = old; }, 1500);
    }

    function saveHistory(item) {
      const list = JSON.parse(localStorage.getItem('short_links_history') || '[]');
      const filtered = list.filter((x) => x.slug !== item.slug);
      filtered.unshift(item);
      localStorage.setItem('short_links_history', JSON.stringify(filtered.slice(0, 10)));
      renderHistory();
    }

    function renderHistory() {
      const list = JSON.parse(localStorage.getItem('short_links_history') || '[]');
      const card = document.getElementById('historyCard');
      const container = document.getElementById('historyList');
      if (!list.length) {
        card.style.display = 'none';
        return;
      }
      card.style.display = 'flex';
      container.innerHTML = list.map((item) => `
        <div class="history-item">
          <div class="history-links">
            <a href="${item.shortUrl}" target="_blank" rel="noopener">${item.shortUrl}</a>
            <div class="history-target">${item.targetUrl}</div>
          </div>
          <button type="button" class="secondary" style="padding: 0.3rem 0.6rem; font-size: 0.78rem;" onclick="copyText('${item.shortUrl}', this)">Copy</button>
        </div>
      `).join('');
    }

    renderHistory();
  </script>
</body>
</html>
